<!DOCTYPE html>
<head>
    <title>Medical Translator Website</title>
    <style>
        body{
            font-family: monospace;
            background: #c9e8f3;
            text-align: center;
            padding: 30px;
        }
        h1 {
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: #4a7ec8;
        }
        .box{
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }
        textarea {
            width: 90%;
            height: 100px;
            padding: 10px;
            margin: 10px;
        }
        button {
            background: #3372c9;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Medical Translator Website</h1>
    <p>This translates complex medical terms into simple language.</p>
</body>
